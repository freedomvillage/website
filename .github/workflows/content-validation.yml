name: Content route validation
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'dist/**'
      - 'scripts/**'
      - 'package.json'
      - 'source-manifest.json'
      - 'wrangler.jsonc'
      - '.github/workflows/content-validation.yml'
permissions:
  contents: read
jobs:
  route-and-air-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      REVIEW_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Fetch exact public review commit without credentials
        shell: bash
        run: |
          [[ "$REVIEW_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init --quiet .
          git remote add origin https://github.com/freedomvillage/website.git
          git fetch --depth=1 origin "$REVIEW_SHA" "$BASE_SHA"
          git checkout --detach "$REVIEW_SHA"
          git worktree add --detach "$RUNNER_TEMP/fvc-before" "$BASE_SHA"
      - name: Verify server content and preserved air behavior
        run: |
          node --version
          npm test
      - name: Render ranked resources in cloud Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/fvc-render" --no-save --ignore-scripts playwright@1.64.1
          "$RUNNER_TEMP/fvc-render/node_modules/.bin/playwright" install chromium
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/fvc-render/node_modules/playwright/index.mjs" node tests/intent-rendered.mjs
          CONTENT_BASELINE_DIR="$RUNNER_TEMP/fvc-before" PLAYWRIGHT_MODULE="$RUNNER_TEMP/fvc-render/node_modules/playwright/index.mjs" node tests/worship-rendered.mjs
      - name: Save rendered review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-review
          path: rendered-review/
          if-no-files-found: ignore
      - name: Save focused Kids entry review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kids-entry-review
          path: |
            rendered-review/*-home-kids-entry-*.png
            rendered-review/*-families-kids-entry-*.png
            rendered-review/journey-recordings/*.webm
          if-no-files-found: ignore
      - name: Save focused Godly editorial review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godly-editorial-review
          path: |
            rendered-review/*-godly-*.png
            rendered-review/*-families-home-full.png
            rendered-review/*-families-category-full.png
            rendered-review/*-kids-detail-full.png
            rendered-review/*-kids-question-open-viewport.png
            rendered-review/journey-recordings/*.webm
          if-no-files-found: ignore
      - name: Save focused Youth page review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youth-page-review
          path: |
            rendered-review/*-youth-*.png
            rendered-review/*-families-home-full.png
            rendered-review/*-families-category-full.png
            rendered-review/journey-recordings/*.webm
          if-no-files-found: ignore
      - name: Save synthetic worship composition review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worship-review
          path: worship-review/
          if-no-files-found: ignore
